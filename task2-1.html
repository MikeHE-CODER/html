<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            color: red;
        }

        s {
            color: grey;
        }

        a {
            color: orange;
        }

        mark {
            background-color: pink;
            color: dimgrey;
        }

        h2 {
            text-align: center;
        }

        div {
            font-size: 80%;
            font-family: monospace;
        }
    </style>
</head>

<body>
    <h1>A red heading</h1>
    <hr>
    <p>All paragraph text is sans-serif. Links, including this link to <a href=">http://html.cat">http://html.cat</a>,
        are orange, while this <s>text
            which
            is
            struck out</s>is grey.</p>
    Highlighted text is <mark>dimgrey against pink.</mark>
    <h2>Level 2 Headings are centred</h2>
    <div>Preformatted text uses the monospace font-family &amp; is 80% normal size.</div>
</body>

</html>
