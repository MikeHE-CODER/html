<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2-1</title>
    <style>
        h1 {
            color: red;
            font-family: sans-serif;
        }

        body {
            font-family: sans-serif;
        }

        hr {
            border: 1px solid black;
        }

        p {
            font-family: sans-serif;
        }

        a {
            color: orange;
            text-decoration: none;
        }

        del {
            color: grey;
        }

        mark {
            background-color: pink;
            color: dimgrey;
        }

        h2 {
            text-align: center;
            font-family: sans-serif;
            font-weight: bold;
        }

        pre {
            font-family: monospace;
            font-size: 80%;
        }
    </style>
</head>

<body>
    <h1>A red heading</h1>
    <hr>

    <p>All paragraph text is sans-serif. Links, including this link to <a href="http://nyan.cat">http://nyan.cat</a>,
        are orange, while this <del>text which is struck out</del> is grey.</p>

    <p>Highlighted text is <mark>dimgrey against pink</mark>.</p>

    <h2>Level 2 Headings are centred</h2>

    <pre>Preformatted text uses the monospace font-family & is 80% normal size.</pre>

</body>

</html>
